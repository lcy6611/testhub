app:
  description: End-to-end testing orchestrator
  icon: 🤖
  icon_background: '#E8F3FF'
  mode: advanced-chat
  name: E2E_Test_Orchestrator
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.41@680b9357e6cd290ef5e8691a35286bffddb75bf30c8dacfe351d8b5e5fd87283
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .PDF
      - .DOC
      - .DOCX
      - .TXT
      - .MD
      - .JSON
      - .YAML
      - .YML
      - .PNG
      - .JPG
      - .JPEG
      allowed_file_types:
      - document
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-casegen
      source: start
      sourceHandle: source
      target: casegen
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: llm
    - id: casegen-review
      source: casegen
      sourceHandle: source
      target: review
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: llm
    - id: review-analysis
      source: review
      sourceHandle: source
      target: analysis
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: llm
    - id: analysis-convert
      source: analysis
      sourceHandle: source
      target: convert
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: llm
    - id: convert-execplan
      source: convert
      sourceHandle: source
      target: execplan
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: llm
    - id: execplan-report
      source: execplan
      sourceHandle: source
      target: report
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: llm
    - id: report-answer
      source: report
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: answer
    nodes:
    - id: start
      type: custom
      position:
        x: 60
        y: 280
      positionAbsolute:
        x: 60
        y: 280
      width: 242
      height: 73
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        selected: false
        title: USER INPUT
        type: start
        variables: []
    - id: casegen
      type: custom
      position:
        x: 340
        y: 280
      positionAbsolute:
        x: 340
        y: 280
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}

            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: Qwen3.5-35B-A3B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: e2e-casegen-sys
          role: system
          text: |-
            你是“测试用例生成智能体”。
            基于用户输入（需求、测试地址、环境说明）生成结构化初稿用例。
            输出格式：
            generated_test_cases:
            <多条用例，含标题/前置条件/步骤/预期结果/优先级>
        selected: false
        title: Agent - CaseGen
        type: llm
        vision:
          enabled: false
    - id: review
      type: custom
      position:
        x: 620
        y: 280
      positionAbsolute:
        x: 620
        y: 280
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: Qwen3.5-35B-A3B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: e2e-review-sys
          role: system
          text: |-
            你是“测试评审智能体”。
            评审以下初稿用例并给出修订建议，不能只说通过。
            初稿：
            {{#casegen.text#}}

            输出格式：
            review_feedback:
            <按高/中/低列出问题与修订建议>

            final_test_cases:
            <根据评审修订后的最终用例>
        selected: false
        title: Agent - Review
        type: llm
        vision:
          enabled: false
    - id: analysis
      type: custom
      position:
        x: 900
        y: 280
      positionAbsolute:
        x: 900
        y: 280
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: Qwen3.5-35B-A3B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: e2e-analysis-sys
          role: system
          text: |-
            你是“测试分析智能体”。
            结合用户输入与最终用例，输出风险分析与执行分层建议。
            最终用例：
            {{#review.text#}}

            输出格式：
            analysis_result:
            <风险、优先级、冒烟/回归/全量分层建议>
        selected: false
        title: Agent - Analysis
        type: llm
        vision:
          enabled: false
    - id: convert
      type: custom
      position:
        x: 1180
        y: 280
      positionAbsolute:
        x: 1180
        y: 280
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: Qwen3.5-35B-A3B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: e2e-convert-sys
          role: system
          text: |-
            你是“自动化转换智能体”。
            把最终用例转换成 AI 自动化执行输入（API/UI 两类）。
            输入：
            {{#review.text#}}

            输出格式：
            automation_cases_api:
            <接口自动化场景与参数/断言要点>

            automation_cases_ui:
            <UI自动化场景与定位/断言要点>
        selected: false
        title: Agent - Convert
        type: llm
        vision:
          enabled: false
    - id: execplan
      type: custom
      position:
        x: 1460
        y: 280
      positionAbsolute:
        x: 1460
        y: 280
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: Qwen3.5-35B-A3B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: e2e-execplan-sys
          role: system
          text: |-
            你是“执行编排智能体”。
            根据自动化用例输出可执行计划。
            输入：
            {{#convert.text#}}

            输出格式：
            execution_plan:
            <执行步骤、环境准备、顺序、并发、失败重跑、产物路径约定>

            simulated_execution_summary:
            <当前先输出模拟执行结果模板，后续可替换为真实执行回调结果>
        selected: false
        title: Agent - ExecPlan
        type: llm
        vision:
          enabled: false
    - id: report
      type: custom
      position:
        x: 1740
        y: 280
      positionAbsolute:
        x: 1740
        y: 280
      width: 242
      height: 88
      selected: true
      sourcePosition: right
      targetPosition: left
      data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: Qwen3.5-35B-A3B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: e2e-report-sys
          role: system
          text: |-
            你是“测试报告智能体”。
            综合各阶段结果，输出可回传 TestHub 的最终报告。
            上游结果：
            [CaseGen]
            {{#casegen.text#}}
            [Review]
            {{#review.text#}}
            [Analysis]
            {{#analysis.text#}}
            [Convert]
            {{#convert.text#}}
            [ExecPlan]
            {{#execplan.text#}}

            输出必须严格为以下字段（都要有值）：
            status:
            trace_id:
            generated_test_cases:
            review_feedback:
            final_test_cases:
            analysis_result:
            automation_cases_api:
            automation_cases_ui:
            execution_plan:
            execution_summary:
            report_markdown:
            report_structured:
            artifacts:
        selected: true
        title: Agent - Report
        type: llm
        vision:
          enabled: false
    - id: answer
      type: custom
      position:
        x: 2020
        y: 280
      positionAbsolute:
        x: 2020
        y: 280
      width: 242
      height: 103
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        answer: '{{#report.text#}}'
        selected: false
        title: ANSWER
        type: answer
        variables: []
    viewport:
      x: -40
      y: 65
      zoom: 0.72
  rag_pipeline_variables: []
