      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}


            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: Qwen3.5-35B-A3B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys-tc-001
          role: system
          text: |-
            你是资深测试工程师。根据用户需求生成高质量测试用例。

            请输出以下三个字段，且都不能为空：

            generated_test_cases:
            - 输出初稿测试用例（标题、前置条件、步骤、预期结果、优先级）

            review_feedback:
            - 对初稿进行评审，指出缺陷、遗漏、歧义、覆盖不足

            final_test_cases:
            - 根据评审意见修订后的最终用例（结构同初稿）

            规则：
            1. 中文输出
            2. 信息不足时写“假设：...”
            3. 仅按上述字段输出，不要额外解释
        selected: true
        title: LLM
        type: llm
        vision:
          enabled: false
