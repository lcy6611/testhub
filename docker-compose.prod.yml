name: testhub_prod

services:
  redis:
    image: ${REDIS_IMAGE:-redis:6-alpine}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    depends_on:
      - redis
    # 生产：用 gunicorn（WSGI）
    command: ["sh", "-lc", "python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 120"]
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    command: ["celery", "-A", "backend", "worker", "-l", "info", "--concurrency=2", "--prefetch-multiplier=1"]

  beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    command: ["celery", "-A", "backend", "beat", "-l", "info"]

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端静态资源：由 frontend_build 容器产出到 volume
      - frontend_dist_prod:/usr/share/nginx/html:ro
      - ./media:/media
      - ./static:/static
    depends_on:
      - backend

  # 生产前端构建（复用开发环境思路：容器里安装依赖并构建，但不影响开发环境文件）
  # 说明：
  # - 产物输出到 named volume：frontend_dist_prod
  # - 可通过 NPM_CONFIG_REGISTRY 指向你们自建 npm 镜像源
  frontend_build:
    image: ${NODE_IMAGE:-node:20-alpine}
    working_dir: /app/frontend
    environment:
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
      NODE_OPTIONS: ${NODE_OPTIONS:---max_old_space_size=4096}
    volumes:
      - ./frontend:/app/frontend
      - frontend_dist_prod:/app/frontend/dist
      - frontend_node_modules_prod:/app/frontend/node_modules
    command: ["sh", "-lc", "npm ci || npm install && npm run build"]

volumes:
  redis_data_prod:
  frontend_dist_prod:
  frontend_node_modules_prod:

