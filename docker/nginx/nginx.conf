server {
    listen 80;
    server_name _;

    # 前端静态文件（Vite build 输出）
    root /usr/share/nginx/html;
    index index.html;

    # 生产推荐：限制上传大小（按需调整）
    client_max_body_size 50m;

    # 缓存策略（解决发版后必须强刷/退出再强刷的问题）
    # - /index.html：不缓存，确保每次都获取最新入口 HTML（从而拿到最新的分包映射）
    # - /assets/*：文件名带 hash，可长期缓存
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端
    # 注意：同时匹配 /api 和 /api/（否则请求 /api 会落到前端 try_files 返回 HTML）
    location ^~ /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        # 关闭响应缓冲，让 Hermes SSE 流式事件能立刻推给前端
        # 否则聊天会积压直到 buffer 满才发出，体验像"卡住"
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    # 静态资源（collectstatic）
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
    }

    # 上传文件（Django MEDIA）
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }
}

